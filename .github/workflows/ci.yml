name: CI — Verificación y Pruebas

on:
  push:
    branches:
      - main
      - desarrollo
      - "feat/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - desarrollo

jobs:
  test:
    name: Linter, Migraciones, Pruebas y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Verificar estilo y errores con Ruff
        run: uv run ruff check src test

      - name: Verificar migraciones pendientes
        run: uv run poki_koa makemigrations --check --dry-run

      - name: Ejecutar pruebas de Django con cobertura
        run: |
          uv run coverage erase
          uv run coverage run src/manage.py test cunas -v 2

      - name: Ejecutar pruebas unitarias aisladas (test/)
        env:
          PYTHONPATH: src
        run: uv run coverage run -a -m unittest discover -s test -v

      - name: Generar reporte de cobertura (mínimo 85%)
        run: |
          uv run coverage report -m --fail-under=85
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-hito2
          path: |
            coverage.xml
            htmlcov/
