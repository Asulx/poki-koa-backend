# Proyecto: Mamoru / Poki Koa — Backend de monitoreo neonatal
# Gestión de dependencias y empaquetado con uv + hatchling

[project]
name = "poki_koa"
version = "0.1.0"
description = "Backend Django REST para el sistema de monitoreo de cunas neonatales Poki Koa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Framework web principal
    "django>=5.2.17",
    # Soporte para solicitudes cross-origin (necesario para conectar con el frontend React/Vite)
    "django-cors-headers>=4.9.0",
    # API REST: serialización, vistas y router automático
    "djangorestframework>=3.18.0",
    # Documentación interactiva OpenAPI 3.0 / Swagger / Redoc
    "drf-spectacular>=0.28.0",
    # Filtrado dinámico de consultas en endpoints
    "django-filter>=24.3",
]

# Define el comando `mamoru` disponible tras ejecutar `uv sync`
# Uso: uv run mamoru [comando django]
[project.scripts]
poki_koa = "poki_koa.main:main"
make-crud = "cunas.management.commands.make_crud:main"
seed-data = "cunas.management.commands.seed_data:main"

# Sistema de construcción del paquete (requerido por uv para instalar el proyecto)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Indica a hatchling dónde están los paquetes Python del proyecto
[tool.hatch.build.targets.wheel]
packages = ["src/poki_koa", "src/cunas"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

# Ruff ignora archivos generados automaticamente por django
[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012"]

