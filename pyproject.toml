# Proyecto: Mamoru / Poki Koa — Backend de monitoreo neonatal
# Gestión de dependencias y empaquetado con uv + hatchling

[project]
name = "poki_koa"
version = "0.1.0"
description = "Backend Django REST para el sistema de monitoreo de cunas neonatales Poki Koa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Framework web principal
    "django>=5.2.17",
    # Soporte para solicitudes cross-origin (necesario para conectar con el frontend React/Vite)
    "django-cors-headers>=4.9.0",
    # API REST: serialización, vistas y router automático
    "djangorestframework>=3.18.0",
]

# Define el comando de gestión Django disponible tras ejecutar `uv sync`
# Uso: uv run poki_koa [comando django]
[project.scripts]
poki_koa = "poki_koa.main:main"
make-crud = "cunas.management.commands.make_crud:main"

# Sistema de construcción del paquete (requerido por uv para instalar el proyecto)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Indica a hatchling dónde están los paquetes Python del proyecto
[tool.hatch.build.targets.wheel]
packages = ["src/poki_koa", "src/cunas"]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "ruff>=0.16.6",
]

# Configuración de cobertura de código (líneas, funciones y ramas)
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/admin.py",
    "*/apps.py",
    "*/__init__.py",
    "*/test*.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/manage.py",
    "*/poki_koa/main.py",
    "*/settings_entregable.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

# Ruff ignora archivos generados automaticamente por django
[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012"]
"src/cunas/models.py" = ["RUF012"]
"src/cunas/serializers.py" = ["RUF012"]
"src/cunas/views.py" = ["RUF012"]
"src/usuarios/models.py" = ["RUF012"]
"src/usuarios/serializers.py" = ["RUF012"]
"src/usuarios/views.py" = ["RUF012"]
"src/operacion/models.py" = ["RUF012"]
"src/operacion/serializers.py" = ["RUF012"]
"src/operacion/views.py" = ["RUF012"]
